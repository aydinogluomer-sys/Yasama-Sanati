name: Quality Gate

# Her PR ve main push'unda tam kapı zinciri.
#
# Sıra kasıtlı: önce ucuz statik kapılar (typecheck/lint/build), sonra sunucu
# gerektiren runtime kapıları. Runtime kapıları prod build'e karşı koşar —
# `next dev` değil, çünkü ölçülmek istenen kullanıcıya giden çıktı.
#
# Görsel regresyon (qa/visual.mjs) bilerek CI'da KOŞMAZ: baseline PNG'ler font
# rasterleştirmesi yüzünden makineye özgüdür ve Linux runner'da yerel baseline'la
# eşleşmez. Yerel kapı olarak `npm run test:visual` ile çalıştırılır.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Playwright motorları
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Sunucuyu başlat
        run: |
          npx next start -p 3400 &
          npx wait-on http://127.0.0.1:3400 --timeout 90000

      - name: E2E smoke (17 rota — landmark, h1, nav, footer, CTA)
        env:
          PW_CHANNEL: chromium
        run: npm run test:e2e

      - name: İç bağlantılar (kırık link = 0)
        env:
          PW_CHANNEL: chromium
        run: npm run test:links

      - name: Görseller (kırık img + optimizer 4xx = 0)
        env:
          PW_CHANNEL: chromium
        run: npm run test:images

      - name: SEO (sitemap, robots, canonical, JSON-LD)
        env:
          PW_CHANNEL: chromium
        run: npm run test:seo

      - name: Erişilebilirlik (axe — serious/critical = 0)
        env:
          PW_CHANNEL: chromium
        run: npm run test:a11y

      - name: Viewport matrisi (8 boyut × 6 rota, taşma = 0)
        env:
          PW_CHANNEL: chromium
        run: npm run test:viewports

      - name: Klavye (skip link, focus trap, ESC)
        env:
          PW_CHANNEL: chromium
        run: npm run test:keyboard

      - name: Zoom ve reflow (WCAG 1.4.10 + 1.4.4)
        env:
          PW_CHANNEL: chromium
        run: npm run test:zoom

      - name: Cross-browser (chromium + firefox + webkit)
        env:
          PW_CHANNEL: chromium
        run: npm run test:browsers
