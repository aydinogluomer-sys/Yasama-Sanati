# ZAMANLAMA KAPALI — 2026-08-22.
#
# Bu iş, ücretsiz katmandaki Supabase projesinin (yasama-sanati) otomatik
# duraklamasını engellemek içindi. Proje sahibi backend'e ihtiyaç olmadığına
# karar verdi: site bir vitrin olarak yayınlanıyor, formlar veri yazmıyor.
# Proje INACTIVE kalacak ve zaten geri yüklenemiyor — organizasyonun ücretsiz
# 2 aktif proje slotu başka iki ürün tarafından dolu.
#
# Zamanlama açık bırakılsaydı haftada iki kez duraklamış bir API'yi yoklayıp
# başarısız olacak ve her seferinde bildirim üretecekti. Bu yüzden `schedule`
# kaldırıldı; iş yalnız elle tetiklenebilir durumda duruyor.
#
# Backend tekrar gerekirse: bir slot boşalt, projeyi geri yükle, aşağıdaki
# cron satırını geri aç.
#   SUPABASE_URL      = https://htpduorvqmidoprkkgwy.supabase.co
#   SUPABASE_ANON_KEY = publishable anon key
name: Supabase keep-alive (elle)

on:
  # schedule:
  #   - cron: "17 6 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not configured"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/newsletter_signups?select=id&limit=1")
          echo "Supabase responded with HTTP ${code}"
          # 200 (RLS allows select) and 401/403/406 (blocked but ALIVE) all count as activity.
          case "$code" in
            200|401|403|406) exit 0 ;;
            *) echo "::error::Unexpected status ${code} — project may be paused"; exit 1 ;;
          esac
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
